<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Сброс кэша — BigBossYan</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        background: #070707;
        color: #f3efe6;
        font-family: "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 12px; color: #f0d78c; }
      p { color: #9a958a; line-height: 1.45; max-width: 28em; margin: 0 auto; }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 14px 20px;
        background: linear-gradient(180deg, #f0d78c, #d4af37);
        color: #14110a;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Обновляю приложение…</h1>
    <p id="msg">Очищаю старый кэш.</p>
    <script>
      (async () => {
        // Должна совпадать с VER в index.html / app.js — иначе бесконечный редирект
        var VER = "36";
        try {
          if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          localStorage.setItem("bigbossyan-ver", VER);
          document.getElementById("msg").textContent = "Готово. Открываю приложение…";
          setTimeout(function () {
            location.replace("./index.html?v=" + VER + "&t=" + Date.now());
          }, 500);
        } catch (e) {
          try { localStorage.setItem("bigbossyan-ver", VER); } catch (_) {}
          document.getElementById("msg").textContent =
            "Автосброс не вышел. Нажми кнопку ниже или очисти данные сайта в браузере.";
          var a = document.createElement("a");
          a.href = "./index.html?v=" + VER + "&t=" + Date.now();
          a.textContent = "Открыть приложение";
          document.body.appendChild(a);
        }
      })();
    </script>
  </body>
</html>
