<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Сброс кэша — BigBossYan</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        background: #070707;
        color: #f3efe6;
        font-family: "Segoe UI", sans-serif;
        padding: 28px;
        text-align: center;
      }
      h1 { font-size: 28px; margin: 0 0 12px; color: #f0d78c; }
      p { color: #9a958a; line-height: 1.45; }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 14px 20px;
        background: linear-gradient(180deg, #f0d78c, #d4af37);
        color: #14110a;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Обновляю приложение…</h1>
    <p id="msg">Очищаю старый кэш.</p>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          localStorage.setItem("bigbossyan-ver", "28");
          document.getElementById("msg").textContent = "Готово. Открываю приложение…";
          setTimeout(() => {
            location.replace("./index.html?v=28&t=" + Date.now());
          }, 400);
        } catch (e) {
          document.getElementById("msg").textContent =
            "Не удалось автоматически. Очисти данные сайта вручную в настройках браузера.";
          const a = document.createElement("a");
          a.href = "./index.html?v=28&t=" + Date.now();
          a.textContent = "Открыть приложение";
          document.body.appendChild(a);
        }
      })();
    </script>
  </body>
</html>
